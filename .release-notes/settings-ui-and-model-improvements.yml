- English: "Settings no longer jump in height when switching tabs"
  Russian: "Настройки больше не меняют высоту при переключении вкладок"
  Ukrainian: "Налаштування більше не змінюють висоту при перемиканні вкладок"
- English: "Copy buttons now match in size across panels"
  Russian: "Кнопки копирования теперь одинакового размера на обеих панелях"
  Ukrainian: "Кнопки копіювання тепер однакового розміру на обох панелях"
- English: "Added a button to clear the source text"
  Russian: "Добавлена кнопка очистки исходного текста"
  Ukrainian: "Додано кнопку очищення вихідного тексту"
- English: "Settings model list now shows only image-capable models, with the newest and recommended ones sorted to the top"
  Russian: "Список моделей в настройках теперь показывает только модели с поддержкой изображений, а новейшие и рекомендуемые модели отсортированы вверху"
  Ukrainian: "Список моделей у налаштуваннях тепер показує лише моделі з підтримкою зображень, а найновіші та рекомендовані моделі відсортовані вгорі"
- English: "Fixed the welcome screen briefly flashing on startup"
  Russian: "Исправлено кратковременное появление приветственного окна при запуске"
  Ukrainian: "Виправлено короткочасну появу вітального вікна під час запуску"
