- English: "Added optional, anonymous usage analytics (how many people use the app and how often) with a clear opt-out choice and a bundled Privacy Policy / Terms of Use — no screen content or translations are ever collected"
  Russian: "Добавлена опциональная анонимная аналитика использования (сколько людей пользуются приложением и как часто) с понятным отказом от участия и встроенными Политикой конфиденциальности и Условиями использования — содержимое экрана и переводы никогда не собираются"
  Ukrainian: "Додано опціональну анонімну аналітику використання (скільки людей користуються застосунком і як часто) із зрозумілою відмовою від участі та вбудованими Політикою конфіденційності й Умовами використання — вміст екрана та переклади ніколи не збираються"
- English: "Added a Settings > General toggle to turn anonymous usage sharing on or off at any time, with links to the Privacy Policy and Terms of Use"
  Russian: "Добавлен переключатель в Настройки > Общие для включения или отключения анонимного обмена данными об использовании в любое время, со ссылками на Политику конфиденциальности и Условия использования"
  Ukrainian: "Додано перемикач у Налаштування > Загальні для увімкнення чи вимкнення анонімного обміну даними про використання в будь-який час, з посиланнями на Політику конфіденційності та Умови використання"
