- English: Added a Light / Dark / System theme picker in Settings
  Russian: Добавлен выбор темы (Светлая / Тёмная / Системная) в настройках
  Ukrainian: Додано вибір теми (Світла / Темна / Системна) у налаштуваннях
- English: Added "Always on Top" and "Launch at Startup" options in Settings
  Russian: Добавлены параметры «Поверх всех окон» и «Запуск при старте системы» в настройках
  Ukrainian: Додано параметри «Поверх усіх вікон» та «Запуск при старті системи» у налаштуваннях
- English: You can now delete individual history entries and see the language pair for each one
  Russian: Теперь можно удалять отдельные записи истории и видеть языковую пару для каждой записи
  Ukrainian: Тепер можна видаляти окремі записи історії та бачити мовну пару для кожного запису
