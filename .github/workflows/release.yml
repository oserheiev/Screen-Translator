name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: npm version "$BUMP" --no-git-tag-version --ignore-scripts

      - name: Read new version
        id: read_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Compile release notes
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: node scripts/compile-release-notes.mjs --version "$VERSION"

      - name: Collect changelog for the GitHub release body
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          node -e "
            const entries = require('./src/whatsnew.json');
            const entry = entries.find(e => e.version === process.env.VERSION);
            const lines = (entry ? entry.bullets : []).map(b => '- ' + b.English);
            require('fs').writeFileSync('release-notes.txt', lines.join('\n') + '\n');
          "

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            git add package.json package-lock.json src/whatsnew.json .release-notes
            git commit -m "chore: release v${VERSION}"
            git tag "v${VERSION}"
            git push origin master "v${VERSION}"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          gh release view "v${VERSION}" 2>/dev/null || \
            gh release create "v${VERSION}" \
              --draft \
              --title "${VERSION}" \
              --notes-file release-notes.txt

  release-mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Read electron version
        id: electron_version
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> $GITHUB_OUTPUT

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ steps.electron_version.outputs.version }}

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.dmg dist/*.zip --clobber

  release-win:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Read electron version
        id: electron_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> $GITHUB_OUTPUT

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-win-${{ steps.electron_version.outputs.version }}

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.exe dist/*.yml --clobber

  publish:
    needs: [prepare, release-mac, release-win]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
